<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>My Inventory Store</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6f9; color: #222; }
  header { background: #1e293b; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 18px; }
  .container { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  input, select, button, textarea { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; font-family: inherit; }
  button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button.danger { background: #dc2626; }
  button.ghost { background: #e2e8f0; color: #222; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
  th { background: #f1f5f9; }
  tr.low { background: #fef2f2; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #dcfce7; color: #166534; }
  .badge.low { background: #fee2e2; color: #991b1b; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal-content { background: #fff; padding: 24px; border-radius: 12px; width: 480px; max-height: 90vh; overflow-y: auto; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; font-weight: 600; }
  .modal-content input, .modal-content textarea { width: 100%; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hidden { display: none; }
  #loginView { max-width: 380px; margin: 80px auto; }
  .stat { padding: 16px; border-radius: 10px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .stat .lbl { font-size: 12px; color: #64748b; text-transform: uppercase; }
  .stat .val { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 12px; }
</style>
</head>
<body>

<div id="loginView">
  <div class="card">
    <h2>🔐 Login</h2>
    <label>Email</label><input id="loginEmail" value="admin@example.com">
    <label>Password</label><input id="loginPassword" type="password" value="admin123">
    <div style="margin-top:14px"><button onclick="login()" style="width:100%">Login</button></div>
  </div>
</div>

<div id="appView" class="hidden">
<header>
  <h1>📦 My Inventory Store</h1>
  <button class="ghost" onclick="logout()">Logout</button>
</header>

<div class="container">
  <div class="grid">
    <div class="stat"><div class="lbl">Total Items</div><div class="val" id="sTotal">0</div></div>
    <div class="stat"><div class="lbl">Low Stock</div><div class="val" id="sLow" style="color:#dc2626">0</div></div>
    <div class="stat"><div class="lbl">Stock Value</div><div class="val" id="sValue">$0</div></div>
    <div class="stat"><div class="lbl">Profit</div><div class="val" id="sProfit" style="color:#16a34a">$0</div></div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="toolbar">
      <input id="search" placeholder="🔍 Search..." oninput="loadItems()">
      <select id="lowFilter" onchange="loadItems()">
        <option value="">All stock</option><option value="low">⚠ Low only</option>
      </select>
      <button onclick="openModal()">+ Add Item</button>
    </div>
    <table>
      <thead><tr>
        <th>Name</th><th>SKU</th><th>Category</th><th>Qty</th><th>Price</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Add Item</h2>
    <input type="hidden" id="id">
    <label>Name *</label><input id="name">
    <div class="row2">
      <div><label>SKU</label><input id="sku"></div>
      <div><label>Barcode</label><input id="barcode"></div>
    </div>
    <div class="row2">
      <div><label>Category</label><input id="category"></div>
      <div><label>Supplier</label><input id="supplier"></div>
    </div>
    <div class="row2">
      <div><label>Quantity</label><input id="quantity" type="number" value="0"></div>
      <div><label>Reorder Level</label><input id="reorder_level" type="number" value="5"></div>
    </div>
    <div class="row2">
      <div><label>Price ($)</label><input id="price" type="number" step="0.01" value="0"></div>
      <div><label>Cost ($)</label><input id="cost" type="number" step="0.01" value="0"></div>
    </div>
    <label>Notes</label><textarea id="notes" rows="2"></textarea>
    <div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
      <button class="ghost" onclick="closeModal()">Cancel</button>
      <button onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function login() {
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: $('loginEmail').value, password: $('loginPassword').value })
  });
  if (!res.ok) return alert('Invalid login');
  showApp();
}
async function logout() { await fetch('/api/logout', { method: 'POST' }); location.reload(); }
async function checkAuth() {
  const res = await fetch('/api/me');
  if (res.ok) showApp(); else $('loginView').classList.remove('hidden');
}
function showApp() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  loadStats(); loadItems();
}

async function loadStats() {
  const s = await (await fetch('/api/stats')).json();
  $('sTotal').textContent = s.total;
  $('sLow').textContent = s.low;
  $('sValue').textContent = '$' + s.value.toFixed(2);
  $('sProfit').textContent = '$' + s.profit.toFixed(2);
}

async function loadItems() {
  const q = $('search').value;
  const low = $('lowFilter').value;
  const data = await (await fetch(`/api/items?q=${encodeURIComponent(q)}&low=${low}`)).json();
  $('rows').innerHTML = data.items.map(i => `
    <tr class="${i.quantity <= i.reorder_level ? 'low' : ''}">
      <td><b>${i.name}</b></td>
      <td>${i.sku || '—'}</td>
      <td>${i.category || '—'}</td>
      <td>${i.quantity}</td>
      <td>$${Number(i.price).toFixed(2)}</td>
      <td><span class="badge ${i.quantity <= i.reorder_level ? 'low' : ''}">
        ${i.quantity <= i.reorder_level ? '⚠ Low' : '✓ OK'}</span></td>
      <td><button class="ghost" onclick='editItem(${JSON.stringify(i)})'>Edit</button>
          <button class="danger" onclick="deleteItem(${i.id})">Del</button></td>
    </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:#888;padding:20px">No items yet</td></tr>';
}

function openModal(item = {}) {
  $('modalTitle').textContent = item.id ? 'Edit Item' : 'Add Item';
  ['id','name','sku','barcode','category','supplier','quantity','price','cost','reorder_level','notes']
    .forEach(k => $(k).value = item[k] ?? (k === 'reorder_level' ? 5 : (['quantity','price','cost'].includes(k) ? 0 : '')));
  $('modal').classList.add('open');
}
function closeModal() { $('modal').classList.remove('open'); }
function editItem(item) { openModal(item); }

async function saveItem() {
  const id = $('id').value;
  const body = {};
  ['name','sku','barcode','category','supplier','notes'].forEach(k => body[k] = $(k).value);
  ['quantity','price','cost','reorder_level'].forEach(k => body[k] = +$(k).value);
  if (!body.name) return alert('Name required');
  const res = await fetch(id ? `/api/items/${id}` : '/api/items', {
    method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) return alert((await res.json()).error);
  closeModal(); loadItems(); loadStats();
}

async function deleteItem(id) {
  if (!confirm('Delete?')) return;
  await fetch(`/api/items/${id}`, { method: 'DELETE' });
  loadItems(); loadStats();
}

checkAuth();
</script>
</body>
</html>
